default:
  image: "rust:latest"
  before_script:
    - echo "Start execution of before_script"
    - rustup self update
    - rustup update stable
    - rustc --version
    - cargo --version

stages:
  - test
  - build

test-job:
  stage: test
  script:
    - echo "Start execution of test-job"
    - cargo check
    - cargo test
  allow_failure: false

build-job:
  stage: build
  variables:
    CARGO_REGISTRY_TOKEN: $CARTIS_API_KEY
  needs:
    - test-job
  script:
    - echo "Start execution of build-job"
    - cargo build --release
    - cargo publish --token $CARGO_REGISTRY_TOKEN
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always