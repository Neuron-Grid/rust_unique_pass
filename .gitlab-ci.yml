default:
  image: "rust:latest"
  before_script:
    - echo "Start execution of before_script"
    - rustup self update
    - rustup update stable
    - rustc --version
    - cargo --version

stages:
  - test
  - lint
  - security
  - deploy

variables:
  CARGO_REGISTRY_TOKEN: $CARTIS_API_KEY

test-job:
  stage: test
  script:
    - echo "Start execution of test-job"
    - cargo check
    - cargo test
    - cargo publish --dry-run
  allow_failure: false

lint-job:
  stage: lint
  script:
    - echo "Start execution of lint-job"
    - cargo clippy --all-targets --all-features -- -D warnings
  allow_failure: false

security-scan-job:
  stage: security
  script:
    - echo "Start execution of security-scan-job with OSV-Scanner"
    - cargo install cargo-osv
    - cargo osv
  allow_failure: false

deploy-job:
  stage: deploy
  needs:
    - test-job
    - lint-job
    - security-scan-job
  script:
    - echo "Start execution of deploy-job"
    - cargo build --release
    - cargo publish --token $CARGO_REGISTRY_TOKEN
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always