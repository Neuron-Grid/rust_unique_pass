default:
  image: "rust:latest"
  before_script:
    - echo "Start execution of before_script"
    - rustup self update
    - rustup update stable

stages:
  - test
  - deploy

variables:
  CARGO_REGISTRY_TOKEN: $CARTIS_API_KEY

test-job:
  stage: test
  script:
    - echo "Start execution of test-job"
    - cargo check
    - cargo test
    - cargo publish --dry-run
    # 依存関係の脆弱性スキャン（本番依存も含む）
    - cargo install cargo-audit --locked
    - cargo audit --deny warnings
  allow_failure: false
  rules:
    - when: always

deploy-job:
  stage: deploy
  needs:
    - test-job
  script:
    - echo "Start execution of deploy-job"
    - cargo build --release
    - cargo publish --token $CARGO_REGISTRY_TOKEN
  rules:
    # main ブランチに付与されたタグの場合のみ実行
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_NAME == "main"'
      when: on_success
    - when: never