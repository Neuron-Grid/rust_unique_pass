image: "rust:latest"

before_script:
  - rustup update stable
  - rustc --version
  - cargo --version

stages:
  - test
  - build

variables:
  CARGO_REGISTRY_TOKEN: $CARTIS_API_KEY

test-job:
  stage: test
  script:
    - echo "Start execution of test-job"
    - cargo check
    - cargo test

build-job:
  stage: build
  script:
    - echo "Start execution of build-job"
    - cargo build --release
    - cargo publish --token $CARGO_REGISTRY_TOKEN
  needs:
    - test-job
  only:
    - main
