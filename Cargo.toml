# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "rust_unique_pass"
version = "0.4.3-beta"
edition = "2021"

[dependencies]
clap = {version = "4.4.2", features = ["derive"] }
fluent = "0.16.0"
fluent-resmgr = "0.0.6"
rand = "0.8.5"
resource = "0.5.0"
unic-langid = "0.9.1"
zxcvbn = "2.2.2"
rust-embed = { version = "8.0.0", features = ["include-exclude"] }

[[bin]]
name = "rupass"
path = "src/main.rs"