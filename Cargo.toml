# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "rust_unique_pass"
version = "0.9.3"
edition = "2024"
license = "Apache-2.0"
description = "A CLI tool for generating a strong password."
authors = ["Neuron Grid <neuron-grid@neuron-grid.net>"]
documentation = "https://docs.rs/rust_unique_pass"
repository = "https://github.com/Neuron-Grid/rust_unique_pass"
readme = "README/README_eng.md"
keywords = ["passwords", "generate", "rupass", "cli", "commandline"]
categories = ["command-line-utilities"]

[dependencies]
thiserror = "2.0.12"
clap = { version = "4.5.39", features = ["derive"] }
fluent = "0.17.0"
rand = "0.9.1"
rand_chacha = "0.3.1"
rust-embed = { version = "8.7.2", features = ["include-exclude"] }
unic-langid = "0.9.6"
zxcvbn = "3.1.0"
tokio = { version = "1.45.1", features = ["full"] }
async-trait = "0.1.88"
futures = { version = "0.3.31", default-features = false, features = ["alloc"] }
zeroize = "1.8.1"
zeroize_derive = { version = "1.4.2", optional = true }
getrandom = "0.2.16"
subtle = "2.6.1"
sha2 = "0.10.9"
num_cpus = "1.17.0"
libc = "0.2.172"

[dev-dependencies]
cargo-audit = "0.21.2"

[lib]
name = "rust_unique_pass"
path = "src/lib.rs"

[[bin]]
name = "rupass"
path = "src/main.rs"