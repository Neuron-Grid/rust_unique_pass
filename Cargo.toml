# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "rust_unique_pass"
version = "0.9.5"
edition = "2024"
license = "Apache-2.0"
description = "A CLI tool for generating a strong password."
authors = ["Neuron Grid <neuron-grid@neuron-grid.net>"]
documentation = "https://docs.rs/rust_unique_pass"
repository = "https://github.com/Neuron-Grid/rust_unique_pass"
readme = "README/README_eng.md"
keywords = ["passwords", "generate", "rupass", "cli", "commandline"]
categories = ["command-line-utilities"]

[dependencies]
thiserror = "2.0.17"
clap = { version = "4.5.53", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
fluent = "0.17.0"
rand = "0.9.2"
rand_chacha = "0.9.0"
rust-embed = { version = "8.9.0", features = ["include-exclude"] }
unic-langid = "0.9.6"
zxcvbn = "3.1.0"
tokio = { version = "1.48.0", features = ["rt", "macros", "io-util", "io-std", "sync", "time"] }
async-trait = "0.1.89"
futures = { version = "0.3.31", default-features = false, features = ["alloc"] }
zeroize = "1.8.2"
zeroize_derive = { version = "1.4.2", optional = true }
getrandom = "0.3.4"
subtle = "2.6.1"
num_cpus = "1.17.0"
libc = "0.2.178"
windows-sys = "0.61.2"

[lib]
name = "rust_unique_pass"
path = "src/lib.rs"

[[bin]]
name = "rupass"
path = "src/main.rs"
